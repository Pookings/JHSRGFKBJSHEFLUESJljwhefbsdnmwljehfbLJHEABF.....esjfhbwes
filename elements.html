/* Atlas family: shared rounded cards, tactile controls, and chemistry colors. */
:root{--bg:#f8f7fd;--surface:#fff;--ink:#24233f;--muted:#63617a;--line:#e0deed;--accent:#6551ce;--accent-soft:#eee9ff;--sidebar:#242045;--sidebar-width:216px;--shadow:0 4px 0 #24233f0c;--focus:#8a5ae0;--button-bg:#6551ce;--button-edge:#4532a2;--good:#26704d;--good-bg:#eff8f2;--bad:#ae433c;--bad-bg:#fff0e9;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:root[data-theme=dark]{--bg:#181727;--surface:#232137;--ink:#f3efff;--muted:#beb8d5;--line:#44405b;--accent:#c5b5ff;--accent-soft:#3d325b;--sidebar:#151326;--shadow:0 4px 0 #0b081c66;--button-bg:#8066d2;--button-edge:#4e378e;--good:#a4dfbe;--good-bg:#243e32;--bad:#ffc1b3;--bad-bg:#442c32;--focus:#c9a5ff}
body{background-image:radial-gradient(#7162a50b .8px,transparent .8px);background-size:16px 16px;line-height:1.6}
h1,h2,h3{font-family:inherit;letter-spacing:-.55px}h1{font-size:36px;line-height:1.16;font-weight:800;letter-spacing:-1.1px}h2,h3{font-weight:750}
.app-header{position:fixed;inset:0 auto 0 0;width:var(--sidebar-width);height:100dvh;background:var(--sidebar);border:0;z-index:20;box-shadow:3px 0 18px #17123308}
.header-inner{width:100%;max-width:none;height:100%;padding:30px 18px 22px;display:flex;flex-direction:column;align-items:stretch;gap:32px}
.brand{color:#fff;gap:12px;font-size:20px;font-weight:750;line-height:1.2;letter-spacing:-.6px;text-align:left;white-space:normal;padding:0 5px}
.brand img{width:48px;height:48px;flex-shrink:0;border-radius:10px;transform:rotate(-5deg);box-shadow:0 4px 0 #08051d44}
.nav{display:flex;flex-direction:column;gap:9px;margin:0;align-self:stretch;order:0;flex-basis:auto;height:auto}
.nav button{display:flex;align-items:center;gap:12px;text-align:left;min-height:49px;padding:11px 15px;color:#d3cee7;border:1px solid transparent;border-radius:12px;font-size:14px;font-weight:650;background:transparent;flex:0}
.nav button>svg{width:19px;height:19px;color:#b6a6f6}
.nav button.active{color:#fff;background:#6651c7;border-color:#8a74e2;box-shadow:0 4px 0 #100c2e55}
.nav button.active>svg{color:#fff}.nav button:hover{color:#fff;background:#39315c}.nav button.active:hover{background:#715dd1}
.header-tools{display:flex;align-items:center;gap:14px;margin-top:auto;padding:18px 5px 0;border-top:1px solid #50486c}
.header-tools .icon-button{width:39px;height:39px;border-radius:11px;background:#37304f;border-color:#51486e;color:#e6dfff}
.header-tools .icon-button:hover{background:#4a406b}.header-help{border:0;background:none;color:#d3cee7;font-size:13px;padding:8px 6px}
.app-main{max-width:1256px;padding:34px 34px 36px;margin:0 auto 0 var(--sidebar-width);min-height:calc(100dvh - 58px)}
.footer{margin-left:var(--sidebar-width);padding:12px 20px 24px}.footer button{font-size:11px}
.home-title{font-size:clamp(28px,2.8vw,40px);letter-spacing:-1.2px;margin:0 0 29px;font-weight:800;line-height:1.16;max-width:none}
.mode-groups{display:grid;gap:30px}
.mode-group,.setup-heading{--tile-ink:#5141ad;--tile-wash:#eee9ff;--tile-edge:#8c78ce}
[data-category=chemistry]{--tile-ink:#08748c;--tile-wash:#def5fb;--tile-edge:#5cb9c7}
[data-category=connections]{--tile-ink:#885b0d;--tile-wash:#fff0b8;--tile-edge:#d8b655}
.mode-group h2{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:750;margin:0 0 14px;letter-spacing:-.4px}
.mode-group h2::after{content:"";height:1px;background:var(--line);flex:1;margin-left:8px}
.group-mark{width:11px;height:11px;border-radius:3px;flex-shrink:0;background:var(--tile-ink);box-shadow:3px -3px 0 var(--tile-wash)}
.mode-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px 14px}
[data-category=chemistry] .mode-list{grid-template-columns:repeat(6,minmax(0,1fr))}
[data-category=connections] .mode-list{grid-template-columns:repeat(3,minmax(0,1fr))}
.mode-button{--card-bg:#b995f6;--card-edge:#9166d3;--art-ink:#352048;display:flex;flex-direction:column;min-width:0;width:100%;padding:0;border:1.5px solid var(--card-edge);border-radius:18px;background:var(--surface);text-align:left;overflow:hidden;box-shadow:0 5px 0 var(--card-edge);transition:transform .18s,box-shadow .18s}
.mode-button[data-mode=map],.mode-button[data-mode=number]{--card-bg:#7661df;--card-edge:#5541b5;--art-ink:#fff}
.mode-button[data-mode=spot],.mode-button[data-mode=valence],.mode-button[data-mode=trends]{--card-bg:#50cddd;--card-edge:#189aaf;--art-ink:#143e4a}
.mode-button[data-mode=family],.mode-button[data-mode=group]{--card-bg:#8294f0;--card-edge:#5e73cf;--art-ink:#212b6a}
.mode-button[data-mode=match],.mode-button[data-mode=ion],.mode-button[data-mode=polyatomic]{--card-bg:#ffab88;--card-edge:#d77956;--art-ink:#482719}
.mode-button[data-mode=mass],.mode-button[data-mode=connections]{--card-bg:#ffd16b;--card-edge:#d8a337;--art-ink:#4d3611}
.mode-button[data-mode=period]{--card-bg:#73d8da;--card-edge:#2babad;--art-ink:#173f48}
.tile-illustration{display:flex;align-items:center;justify-content:center;width:100%;height:114px;flex-shrink:0;color:var(--art-ink);background-color:var(--card-bg);background-image:radial-gradient(#ffffff42 1px,transparent 1px);background-size:18px 18px;position:relative;isolation:isolate;overflow:hidden}
.tile-illustration::before{content:"";position:absolute;width:70px;height:70px;border:14px solid #ffffff24;border-radius:50%;left:-32px;top:-35px;z-index:-1}
.tile-illustration::after{content:"";position:absolute;width:27px;height:27px;border:5px solid #ffffff33;border-radius:8px;right:-7px;bottom:-8px;transform:rotate(20deg);z-index:-1}
.tile-art{width:164px;max-width:calc(100% - 18px);height:94px;color:var(--art-ink);stroke-width:1.7;filter:drop-shadow(0 3px 0 #18132413);transition:transform .2s}
.tile-art text{fill:currentColor;stroke:none;font-family:inherit}.tile-art .art-paper{fill:#ffffff36}.tile-art .art-soft{fill:currentColor;fill-opacity:.17;stroke:currentColor;stroke-opacity:.3;stroke-width:1}.tile-art .art-fill{fill:currentColor;stroke:none}.tile-art .art-faint{stroke-opacity:.45}
.tile-caption{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 13px;min-height:65px;width:100%;font-size:14px;font-weight:750;letter-spacing:-.3px;line-height:1.3}
.tile-caption>svg{width:24px;height:24px;padding:5px;border-radius:50%;color:var(--art-ink);background:var(--card-bg);flex-shrink:0}

 if(tile&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(ev.key)){
 ev.preventDefault();const all=[...tile.closest('.periodic-table').querySelectorAll('button:not(:disabled)')],r=+tile.dataset.row,c=+tile.dataset.col,h=ev.key==='ArrowLeft'||ev.key==='ArrowRight',dir=ev.key==='ArrowLeft'||ev.key==='ArrowUp'?-1:1;
 const candidates=all.filter(b=>h?(+b.dataset.col-c)*dir>0:(+b.dataset.row-r)*dir>0).sort((a,b)=>{const score=x=>h?Math.abs(+x.dataset.row-r)*100+Math.abs(+x.dataset.col-c):Math.abs(+x.dataset.row-r)*100+Math.abs(+x.dataset.col-c);return score(a)-score(b);});
 if(candidates[0]){all.forEach(b=>b.tabIndex=-1);candidates[0].tabIndex=0;candidates[0].focus();}return;
 }
 if(state.view==='quiz'&&!state.session.match&&!['INPUT','SELECT','TEXTAREA'].includes(ev.target.tagName)){
 const s=state.session,q=s.questions[s.index];if(!s.feedback&&q.options&&/^[1-4]$/.test(ev.key)){const i=+ev.key-1;if(q.options[i]){ev.preventDefault();submitAnswer(q.options[i]);}}
 else if(s.feedback&&ev.key==='Enter'&&ev.target.id!=='next-button'&&ev.target.tagName!=='BUTTON'){ev.preventDefault();nextQuestion();}
 }
});
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();installPrompt=ev;});
window.addEventListener('storage',ev=>{if(ev.key===STORAGE_KEY&&state.view!=='quiz'){try{progress=ev.newValue?validateProgress(JSON.parse(ev.newValue)):blankProgress();render();}catch{toast('Could not read progress from another tab.');}}});
render();
</script>
